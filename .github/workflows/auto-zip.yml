name: quality-gate

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality_gate:
    name: quality-gate
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout ChatOverlay main for OverlayHub sync gate
        id: sibling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runnerTemp = $env:RUNNER_TEMP
          if ([string]::IsNullOrWhiteSpace($runnerTemp)) {
            throw 'RUNNER_TEMP is not set'
          }
          $syncRoot = Join-Path $runnerTemp 'gbfr-overlayhub-sync-chat-overlay'
          $siblingPath = Join-Path $syncRoot 'ChatOverlay'
          $resolvedTemp = [System.IO.Path]::GetFullPath($runnerTemp)
          $resolvedSibling = [System.IO.Path]::GetFullPath($siblingPath)
          $tempPrefix = $resolvedTemp.TrimEnd([System.IO.Path]::DirectorySeparatorChar) + [System.IO.Path]::DirectorySeparatorChar
          if (-not $resolvedSibling.StartsWith($tempPrefix, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Refusing to clean outside RUNNER_TEMP: $resolvedSibling"
          }
          if (Test-Path -LiteralPath $siblingPath) {
            Remove-Item -LiteralPath $siblingPath -Recurse -Force
          }
          New-Item -ItemType Directory -Path $syncRoot -Force | Out-Null
          git clone --depth 1 --branch main --single-branch "https://github.com/cajoxorize366-oss/GBFR.ChatOverlay.git" $siblingPath
          if ($LASTEXITCODE -ne 0) {
            throw "git clone failed with exit code $LASTEXITCODE"
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "path=$siblingPath"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          }
          else {
            $modConfigPath = Join-Path $env:GITHUB_WORKSPACE 'GBFR.ExtraSigilSlots.Reloaded/ModConfig.json'
            if (-not (Test-Path -LiteralPath $modConfigPath -PathType Leaf)) {
              throw "Missing ModConfig.json: $modConfigPath"
            }
            $version = (Get-Content -Raw -LiteralPath $modConfigPath | ConvertFrom-Json).ModVersion
          }
          if ($version -notmatch '^[0-9A-Za-z][0-9A-Za-z._-]*$') {
            throw "Invalid version resolved: $version"
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$version"

      - name: Verify shared OverlayHub sources
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/VerifyOverlayBrokerSync.ps1" `
            -OtherRepository "${{ steps.sibling.outputs.path }}"

      - name: Build Reloaded ZIP
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/build-release.ps1" `
            -Configuration Release `
            -Platform x64 `
            -Version "${{ steps.version.outputs.version }}"

      - name: Run smoke harnesses
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/tests/run-smoke-tests.ps1" -Configuration Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: extra-sigil-slots-${{ steps.version.outputs.version }}
          path: dist/GBFR-Extra-Sigil-Slots-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach ZIP to GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: quality_gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: extra-sigil-slots-${{ needs.quality_gate.outputs.version }}
          path: release

      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          asset="$(find "$GITHUB_WORKSPACE/release" -maxdepth 1 -type f -name '*.zip' -print -quit)"
          if [[ -z "$asset" ]]; then
            echo "::error::No ZIP artifact found under release/"
            exit 1
          fi
          if ! gh release view "$GITHUB_REF_NAME" --json tagName >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
